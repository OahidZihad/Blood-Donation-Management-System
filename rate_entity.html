<!DOCTYPE html>
<html>
	<head>
		<title>Rate Entity</title>
	</head>

	<style>
a:link, a:visited {
  background-color: #89CFF0;
  color: white;
  padding: 2px 8px;
  border-radius: 50px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

a:hover, a:active {
  background-color: cyan;
}

label {
  font-weight: bold;
}

.form-group {
  margin-bottom: 12px;
}
</style>

	<body>
		<img src="Images/blood2.gif" alt="" style="width: 300px;height: 150px;margin-left: 200px;margin-top: 20px;margin-bottom: -10px">

		<h1 align="center" style="font-size:2.00em;font-weight:bold;color:Red;margin-top: -20px">Rate an Entity</h1>

		<div style="border: 4px solid red; border-radius: 20px; width: 40%; margin-left: auto; margin-right: auto; margin-top: 20px; padding: 20px; background-color: powderblue;">
			<form action="rate_entity_script.php" method="POST">

				<div class="form-group">
					<label for="entity_type">Entity Type:</label><br>
					<select name="entity_type" id="entity_type" required style="margin-top: 4px; padding: 4px; width: 100%;">
						<option value="">-- Select Type --</option>
						<option value="donor">Donor</option>
						<option value="blood_bank">Blood Bank</option>
						<option value="seeker">Seeker</option>
					</select>
				</div>

				<div class="form-group">
					<label for="entity_id">Entity ID:</label><br>
					<input type="number" name="entity_id" id="entity_id" min="1" required
					       style="margin-top: 4px; padding: 4px; width: 100%; box-sizing: border-box;"
					       placeholder="Enter the ID of the entity">
				</div>

				<div class="form-group">
					<label for="score">Score (1–10):</label><br>
					<input type="number" name="score" id="score" min="1" max="10" required
					       style="margin-top: 4px; padding: 4px; width: 100%; box-sizing: border-box;"
					       placeholder="Enter a score between 1 and 10">
				</div>

				<div class="form-group">
					<label for="comment">Comment (optional):</label><br>
					<textarea name="comment" id="comment" rows="4"
					          style="margin-top: 4px; padding: 4px; width: 100%; box-sizing: border-box;"
					          placeholder="Leave a comment (optional)"></textarea>
				</div>

				<div style="text-align: center;">
					<input type="submit" value="Submit Rating"
					       style="background-color: #89CFF0; color: white; border: none; padding: 8px 20px;
					              border-radius: 50px; font-size: 1em; cursor: pointer;">
				</div>

			</form>
		</div>

		<br>
		<div align="center">
			<a href="index.html">HOME</a>
		</div>
		<br>
	</body>
</html>
