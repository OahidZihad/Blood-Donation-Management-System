<!DOCTYPE html>
<html>
	<head>
		<title>Rate Entity</title>
	</head>

	<style>
a:link, a:visited {
  background-color: #89CFF0;
  color: white;
  padding: 2px 8px;
  border-radius: 50px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

a:hover, a:active {
  background-color: cyan;
}

form {
  width: 50%;
  margin: 20px auto;
  padding: 20px;
  border: 4px solid red;
  border-radius: 20px;
  background-color: powderblue;
}

label {
  font-weight: bold;
  color: Tomato;
  display: block;
  margin-top: 12px;
}

input[type="number"], select, textarea {
  width: 100%;
  padding: 6px;
  margin-top: 4px;
  border-radius: 6px;
  border: 1px solid #aaa;
  box-sizing: border-box;
}

input[type="submit"] {
  margin-top: 16px;
  background-color: #89CFF0;
  color: white;
  border: none;
  padding: 8px 20px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 1em;
}

input[type="submit"]:hover {
  background-color: cyan;
}
</style>

	<body>
		<img src="Images/blood2.gif" alt="" style="width: 300px;height: 150px;margin-left: 200px;margin-top: 20px;margin-bottom: -10px">

		<h1 align="center" style="font-size:2.50em;font-weight:bold;color:Red;margin-top:-20px">Rate an Entity</h1>

		<form action="rate_entity_script.php" method="POST">

			<label for="entity_type">Entity Type:</label>
			<select name="entity_type" id="entity_type" required>
				<option value="">-- Select Type --</option>
				<option value="donor">Donor</option>
				<option value="blood_bank">Blood Bank</option>
				<option value="seeker">Seeker</option>
			</select>

			<label for="entity_id">Entity ID:</label>
			<input type="number" name="entity_id" id="entity_id" min="1" required placeholder="Enter the entity ID">

			<label for="score">Score (1–10):</label>
			<input type="number" name="score" id="score" min="1" max="10" required placeholder="Enter a score from 1 to 10">

			<label for="comment">Comment (optional):</label>
			<textarea name="comment" id="comment" rows="4" placeholder="Leave a comment..."></textarea>

			<input type="submit" value="Submit Rating">
		</form>

		<p align="center"><a href="index.html">Back to Home</a></p>
	</body>
</html>
